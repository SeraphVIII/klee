syntax = "proto3";

package klee.mapofsets;

message Header {
  uint64 magic                    = 1;  // 0x4d41504f53455453ULL ("MAPOSETS")
  uint32 version                  = 2;  // 2 (v1 is no longer supported)
  uint32 root_id                  = 3;
  uint64 total_nodes              = 4;
  uint32 canonicalization_version = 5;  // key format version; must match current build
  uint32 chunk_size               = 6;  // nodes per chunk
  uint64 directory_offset         = 7;  // byte offset of directory in file
  uint64 directory_size           = 8;  // byte size of directory
  uint64 values_offset            = 9;  // byte offset of values region in file
  uint64 values_size              = 10; // byte size of values region
  uint64 string_table_offset      = 11; // byte offset of string table in file
  uint64 string_table_size        = 12; // byte size of string table
}

message Child {
  bytes  key       = 1;  // unused in v2; kept for proto field number stability
  uint32 child_id  = 2;
  uint32 key_index = 3;  // v2: index into the file's string table
}

message Node {
  bool            is_end_of_set = 1;
  uint64          value_offset  = 2;  // offset+1 into values region (0 = no value)
  repeated Child  children      = 3;  // sorted by key
}

message NodeChunk {
  uint32        first_node_id = 1;
  uint32        node_count    = 2;
  repeated Node nodes         = 3;
}

// The header protobuf written at the start of the file.
// All bulk data (values, directory, chunks) lives in the mmap'd file region
// and is referenced by offsets recorded in Header.
message MapOfSetsFile {
  Header header = 1;
}
